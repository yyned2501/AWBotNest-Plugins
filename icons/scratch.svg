<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bg5" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00acc1"/>
      <stop offset="100%" stop-color="#006064"/>
    </linearGradient>
  </defs>
  <rect width="128" height="128" rx="24" fill="url(#bg5)"/>
  <!-- 硬币 -->
  <circle cx="64" cy="60" r="32" fill="none" stroke="#fff" stroke-width="4"/>
  <circle cx="64" cy="60" r="24" fill="none" stroke="#fff" stroke-width="2" opacity="0.4"/>
  <text x="64" y="68" font-family="sans-serif" font-size="36" font-weight="bold" fill="#ffd54f" text-anchor="middle" dominant-baseline="central">$</text>
