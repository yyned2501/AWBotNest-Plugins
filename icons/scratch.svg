    <line x1="30" y1="30" x2="50" y2="50"/>
    <line x1="38" y1="28" x2="58" y2="48"/>
    <line x1="70" y1="70" x2="98" y2="98"/>
    <line x1="78" y1="68" x2="100" y2="90"/>
    <line x1="28" y1="82" x2="50" y2="90"/>
    <line x1="82" y1="28" x2="98" y2="44"/>
  </g>
  <!-- 星星装饰 -->
