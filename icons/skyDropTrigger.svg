<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4fc3f7"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
    <linearGradient id="coin" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffd54f"/>
      <stop offset="100%" stop-color="#ff8f00"/>
    </linearGradient>
  </defs>
  <rect width="128" height="128" rx="24" fill="url(#sky)"/>
  <!-- 云朵 -->
  <ellipse cx="44" cy="40" rx="20" ry="12" fill="#fff" opacity="0.9"/>
  <ellipse cx="72" cy="34" rx="24" ry="15" fill="#fff" opacity="0.95"/>
  <ellipse cx="90" cy="43" rx="16" ry="10" fill="#fff" opacity="0.85"/>
  <!-- 掉落箭头 -->
  <line x1="64" y1="52" x2="64" y2="60" stroke="#fff" stroke-width="4" stroke-linecap="round"/>
  <path d="M56 58 L64 66 L72 58" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- 掉落的金币 -->
  <circle cx="64" cy="86" r="17" fill="url(#coin)" stroke="#fff" stroke-width="2"/>
  <text x="64" y="87" font-family="sans-serif" font-size="18" font-weight="bold" fill="#b71c1c" text-anchor="middle" dominant-baseline="central">¥</text>
  <!-- 两侧小银币 -->
  <circle cx="34" cy="72" r="7" fill="url(#coin)" opacity="0.85"/>
  <circle cx="94" cy="76" r="6" fill="url(#coin)" opacity="0.75"/>
</svg>
