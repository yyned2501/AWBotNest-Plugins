[project]
name = "awbotnest-plugins"
version = "0.1.0"
requires-python = ">=3.12"

[tool.ruff]
line-length = 120
exclude = [".claude", "plugins/_TEMPLATE.py", "plugins/skyDropAnswer/templates"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "ANN"]
ignore = ["ANN401"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"

[dependency-groups]
dev = [
    "ruff>=0.16.0",
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
]
